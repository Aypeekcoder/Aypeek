<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>East Medinipur Durga Puja</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5b06b;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            padding: 50px;
        }
        .puja-card {
            width: 900px;
            min-height: 600px;
            background: linear-gradient(rgb(246, 131, 131),rgb(180, 241, 250));
            border-radius: 25px;           
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            padding: 50px;
        }
        .content {
            width: 100%;
        }
        .top-text {
            color: #16090f;
            font-size: 22px;
            font-weight: bold;

            margin-bottom: 30px;
        }

        h1 {
            color: rgb(222, 80, 80);

            font-size: 60px;
            line-height: 1.1;

            margin-bottom: 30px;
        }

        .description {
            color: #ee3893;

            font-family: Georgia, serif;

            font-size: 25px;
            line-height: 1.6;

            margin-bottom: 35px;
        }

        .explore-btn {
            display: inline-block;
            background: #c78d1a;
            color: rgb(2, 25, 33);

            padding: 18px 75px;
            border-radius: 50px;
            font-family: Georgia, serif;
            font-size: 28px;
            font-style: italic;
            text-decoration: none;
            transition: 0.3s;
        }
        .explore-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        @media (max-width: 950px) {
            .puja-card {
                width: 90%;
            }

            h1 {
                font-size: 50px;
            }
        }
        @media (max-width: 600px) {
            body {
                padding: 20px;
            }
            .puja-card {
                width: 100%;
                min-height: 600px;
                padding: 30px 20px;
            }
            .top-text {
                font-size: 16px;
                line-height: 1.5;
            }
            h1 {
                font-size: 38px;
            }
            .description {
                font-size: 19px;
            }
            .explore-btn {
                font-size: 22px;
                padding: 15px 50px;
            }

        }
    </style>
</head>
<body>
    <div class="puja-card">
        <div class="content">
            <div class="top-text">
                শরতের আকাশে মায়ের আগমনী বার্তা ~• East Medinipur 
            </div>
            <h1>
                Best Durga Puja celebrations <br>
            </h1>
            <p class="description">
                Explore the Beauty, Tradition and Festive Spirit of East Medinipur.
                A Celebration of Faith, Culture, Tradition and Togetherness.
            </p>
            <a href="Durgapuja.html" class="explore-btn">
                Explore
            </a>
        </div>

    </div>
</body>
</html>
